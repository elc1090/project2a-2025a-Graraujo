<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>GitHub API</title>
    <link rel="icon" type="image/png" href="assets/favicon.ico">

    <!-- Import the Bootstrap CSS CDN -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <img src="assets/octocat.png" alt="GitHub Logo" class="mx-auto d-block mt-5" style="width: 200px; height: 200px;">
    <h3 class="text-center mt-3">GitHub API</h3>
    <form id="gitHubForm" class="form-inline mx-auto flex-column align-items-middle " style="width: 300px">
        <input id="usernameInput" class="form-control mb-3" type="text" name="username" placeholder="GitHub Username">
        <input id="repositoryInput" class="form-control mb-4" type="text" name="repository" placeholder="Repository Name">
        <input type="submit" class="btn btn-primary mb-3" value="Submit">
    </form>
    <ul id="userRepos" class="list-group mx-auto mb-5" style="width: 500px"></ul>
    <script src="app.js"></script>
    
</body>

</html>
